[package]
name = "ecp-clipboard"
version = "0.1.0"
edition = "2024"
description = "A lightweight, local-first clipboard manager for Windows"
repository = "https://github.com/MermaidFAR/Ecp-clipboard"
license = "MIT"
authors = ["MermaidFAR <MermaidFAR@users.noreply.github.com>"]

[workspace]
members = [".", "ui"]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "ecp-clipboard"
path = "src/main.rs"

[[bin]]
name = "ecp"
path = "src/ecp_cli_main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clipboard-win = "5.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tray-icon = "0.20"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System",
    "Win32_System_DataExchange",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
