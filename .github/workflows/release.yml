name: Release eligibility

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Inspect locked dependency licenses
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          $blocked = $metadata.packages | Where-Object {
            -not $_.license -or ($_.license -match 'GPL' -and $_.license -notmatch ' OR ')
          }
          if ($blocked) {
            $blocked | Select-Object name, version, license | Format-Table -AutoSize
            throw 'A dependency requires license review before publication.'
          }
          Write-Host 'Automated scan passed. Manual license and notice review is still required.'

      - name: Build release candidates locally in CI
        run: cargo build --workspace --release --locked
